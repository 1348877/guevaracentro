    <!-- Cabeza -->
    <path d="M40 25 C50 15, 70 15, 80 25 C85 35, 85 45, 80 55 C75 65, 65 70, 50 70 C35 70, 25 65, 20 55 C15 45, 15 35, 20 25 Z" 
          fill="#ffffff" opacity="0.9"/>
    
